    <script>
      // Set theme and language before first paint, so the page never flashes.
      ;(function () {
        var d = document.documentElement
        try {
          var t = localStorage.getItem('santro:theme')
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          d.dataset.theme = t
          var l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('santro:lang')
          if (l !== 'id' && l !== 'en') {
            l = (navigator.language || 'id').toLowerCase().indexOf('id') === 0 ? 'id' : 'en'
          }
          d.lang = l
        } catch (e) {}
      })()
    </script>
